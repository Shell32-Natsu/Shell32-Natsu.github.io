  LinkedIn: https://www.linkedin.com/in/dong-xia
  Facebook: https://www.facebook.com/xiadong1994
  Email: mailto:xiadong.main@gmail.com

friend_links:
  打满鸡血来刷题: https://wf94.github.io/
  塞外麾下炙: http://tianyuh.com/

# Comments (loaded lazily when the reader scrolls near them)
disqus_shortname: www-xiadong-info

