# ===========================================
# Natsu — a quiet, single-column Hexo theme
# ===========================================
# CSS/JS URLs carry a content hash automatically; no version to bump.

since: 2014
favicon: /favicon.svg

# Top navigation (the brand links home).
menu:
  - name: 归档
    path: /archives/
  - name: LeetCode
    path: /categories/LeetCode/
  - name: 标签
    path: /tags/
  - name: 关于
    path: /about/

# Homepage
home:
  title: 写生活，也写代码。
  intro: 湾区码农，Ex-Googler。做过 k8s，做过 Linux 内核，现在在 Anthropic 做 SWE。
  # Posts in these categories are left out of the homepage list; they keep
  # their own index (see `home.collections`) and still appear in 归档.
  exclude_categories:
    - LeetCode
  collections:
    - name: LeetCode 题解
      category: LeetCode
      desc: 2016 – 2018 年刷题时写下的解题笔记
    - name: LeetCode Notes
      path: /leetcode-notes/
      desc: 刷题记录的前言与近况

